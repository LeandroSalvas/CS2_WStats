"CS2 WStats Game State Integration"
{
    // Envia telemetria para a aplicacao na rede interna do Docker.
    "uri" "http://cs2-web-app:3000/api/gsi"
    "timeout" "5.0"
    "buffer"  "0.1"
    "throttle" "0.5"
    "heartbeat" "15.0"

    // Sincronizado automaticamente pelo entry.sh a partir do WEBHOOK_SECRET no .env.
    "auth"
    {
        "token" "{{WEBHOOK_SECRET}}"
    }

    "data"
    {
        "provider"               "1"
        "map"                    "1"
        "round"                  "1"
        "bomb"                   "1"
        "phase_countdowns"       "1"
        "player_id"              "1"
        "player_pos"             "1"
        "player_state"           "1"
        "allplayers_id"          "1"
        "allplayers_position"    "1"
        "allplayers_state"       "1"
        "allplayers_match_stats" "1"
    }
}
