// Zueira CS2 — server.cfg (montado read-only no container)
hostname "Zueira CS2"
sv_region 1
sv_lan 0

// Player list completa no query (A2S)
host_players_show 2

// Sem hibernacao: servidor 24/7 sempre ativo
sv_hibernate_when_empty 0

// Slots reais
maxplayers 24

// Bots removidos — v1.3.0
// bot_quota 2
// bot_quota_mode normal
// bot_join_after_player 0

// Casual
mp_roundtime 115
mp_freezetime 2
mp_roundtime_hostage 115
mp_timelimit 60
mp_autoteambalance 1
mp_maxrounds 24

// Fim de partida / votacao de mapa
mp_match_end_changelevel 0
mp_endmatch_votenextmapat 1
mp_endmatch_votenext_maptime 30

// GOTV (Source TV) na porta 27031 — assistir de dentro do jogo
tv_enable 1
tv_port 27031
tv_delay 30
tv_maxclients 128

// Votacoes e clima do servidor
sv_allow_votes 1
sv_vote_issue_timelimit_change_allowed 1
sv_vote_issue_timelimit_duration 60
